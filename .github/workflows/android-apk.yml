name: Android APK

# Builds an installable FreshKeep APK (no Expo account or signing keys needed — it is
# signed with the debug key, fine for demos and side-loading). Download it from the run's
# "Artifacts" section.
# The APK talks to the AI server at the repo variable FRESHKEEP_API_URL
# (Settings → Secrets and variables → Actions → Variables). Without it the app runs offline.
on:
  push:
    paths: ['app/**', 'server/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: app/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: ${{ vars.FRESHKEEP_API_URL }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: freshkeep-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FreshKeep.apk
      # Each build becomes a release; the newest is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/FreshKeep.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: FreshKeep for Android (build ${{ github.run_number }})
          make_latest: true
          files: app/FreshKeep.apk
          body: |
            **Download:** FreshKeep.apk below. On the Android phone, open it and allow "Install unknown apps" when asked.

            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Signed with a debug key — for demos and testing, not the Play Store.
            AI server: ${{ vars.FRESHKEEP_API_URL || 'not built in (set it in Profile → AI server)' }}
